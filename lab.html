<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <title>Lámina Figure Lab</title>
    <style>
      :root { --ink: #1c1a17; --muted: #7b7466; --rule: #e7e2d8; --accent: #9e2b25; }
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font: 12px/1.4 ui-monospace, 'IBM Plex Mono', Menlo, monospace; color: var(--ink); }
      #lab { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lab-label { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: opacity .2s; }
      .lab-label i { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #fff; }
      .lab-label span { background: rgba(255,255,255,.88); padding: 1px 6px; border: 1px solid var(--rule); border-radius: 3px; }
      .lab-label.occluded { opacity: .35; }
      #panel { position: fixed; top: 10px; right: 10px; width: 260px; max-height: calc(100% - 20px); overflow: auto; background: rgba(255,255,255,.94);
               border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(28,26,23,.06); }
      #panel h1 { font-size: 13px; margin: 0 0 8px; line-height: 1.3; } #panel h1 small { display: block; color: var(--muted); font-weight: 400; }
      #panel label { display: block; margin: 5px 0; } #panel label.inline { display: inline-flex; gap: 4px; align-items: center; margin: 0 0 0 8px; }
      #panel input[type=range] { width: 100%; margin: 2px 0 0; accent-color: var(--ink); } #panel output { float: right; color: var(--muted); }
      #panel fieldset { border: 1px solid var(--rule); border-radius: 6px; margin: 8px 0; padding: 4px 8px 6px; } #panel legend { color: var(--muted); padding: 0 4px; }
      #panel button { margin: 2px; font: inherit; background: #fff; border: 1px solid #d8d2c6; border-radius: 4px; padding: 2px 7px; cursor: pointer; }
      #panel button:hover { border-color: var(--ink); } #panel button:disabled { opacity: .4; cursor: wait; }
      #panel select { font: inherit; } #panel .row { display: flex; align-items: center; margin: 4px 0; }
      #panel .err { color: #b00; } #panel .beats { color: var(--muted); margin-top: 6px; } #panel .beats p { margin: 2px 0; }
      #panel .beats p.on { color: var(--ink); }
      @media (max-width: 600px) { #panel { width: auto; left: 10px; max-height: 45%; } }
    </style>
  </head>
  <body>
    <canvas id="lab"></canvas>
    <div id="labels"></div>
    <aside id="panel" aria-label="Figure lab controls"></aside>
    <script type="module" src="./src/lab/lab.js"></script>
  </body>
</html>
